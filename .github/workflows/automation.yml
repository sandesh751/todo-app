name: build and deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: "project-3d4fd68e-9492-4690-aa8"
  AR_URL: "us-central1-docker.pkg.dev"
  REPO_NAME: "image-collector"
  IMAGE_NAME: "todo-app"
  AR_REPO_LOCATION: "us-central1"
  WORKLOAD_IDENTITY_PROVIDER: "projects/511846968460/locations/global/workloadIdentityPools/my-pool2/providers/github"
  SERVICE_ACCOUNT: "my-service@project-3d4fd68e-9492-4690-aa8.iam.gserviceaccount.com"


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4


      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: configure docker to AR
        run: |
          gcloud auth configure-docker  ${{env.AR_URL}} --quiet

      - name: build image by docker
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/project-3d4fd68e-9492-4690-aa8/image-collector/${{ env.IMAGE_NAME }}:${{ github.sha }}
            -t us-central1-docker.pkg.dev/project-3d4fd68e-9492-4690-aa8/image-collector/${{ env.IMAGE_NAME }}:latest ./

      - name: push to Ar
        run: |
          docker push us-central1-docker.pkg.dev/project-3d4fd68e-9492-4690-aa8/image-collector/${{ env.IMAGE_NAME }}:latest
          docker push us-central1-docker.pkg.dev/project-3d4fd68e-9492-4690-aa8/image-collector/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: deploy to GCP VM
        u
        
  
